require conf/distro/poky.conf

DISTRO = "minimal-desktop"
DISTRO_NAME = "Minimal Desktop"

EXTRA_IMAGE_FEATURES:remove = " debug-tweaks"
EXTRA_IMAGE_FEATURES:append = " allow-root-login"

ROOT_PASSWD = "\$6\$EcrQCmc4FC8oY8Gu\$MNtBPD8mOktVleWl.J69hFza.KfW2v4VBH7hMzgDATYCQJpBI1YWlFxoBeL.IqwkcSqGYMAojDzFPsh9GJJC4/"

INHERIT += "extrausers"
EXTRA_USERS_PARAMS = "usermod -p '${ROOT_PASSWD}' root;"

DISTRO_FEATURES:append = " wayland pam usrmerge"
PREFERRED_PROVIDER_virtual/mesa = "mesa"
PREFERRED_PROVIDER_virtual/libgl = "mesa"
PREFERRED_PROVIDER_virtual/libgles1 = "mesa"
PREFERRED_PROVIDER_virtual/libgles2 = "mesa"
PREFERRED_PROVIDER_virtual/egl = "mesa"

# Enable VC4 graphics driver
ENABLE_DWC2_HOST = "1"
ENABLE_UART = "1"
GPU_MEM = "128"

# Enable systemd
DISTRO_FEATURES:append = " systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
# Optional: Remove sysvinit if you want pure systemd
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"

PACKAGECONFIG:append:pn-sdl3 = " wayland"