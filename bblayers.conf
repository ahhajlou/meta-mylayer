# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

BBLAYERS = " \
  /opt/yocto-docker/poky/meta \
  /opt/yocto-docker/poky/meta-poky \
  /opt/yocto-docker/poky/meta-yocto-bsp \
  /opt/yocto-docker/meta-openembedded/meta-oe \
  /opt/yocto-docker/meta-openembedded/meta-python \
  /opt/yocto-docker/meta-openembedded/meta-networking \
  /opt/yocto-docker/meta-raspberrypi \
  /opt/yocto-docker/meta-mylayer \
  /opt/yocto-docker/meta-qt6 \
  /opt/yocto-docker/build-walnascar/workspace \
  "

