header:
  version: 8

distro: poky
target: core-image-minimal

repos:
  poky:
    url: https://git.yoctoproject.org/git/poky
    path: layers/poky
    # scarthgap
    commit: 9036bc090c771c710796e3690da59d3ebb96dcf1
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: http://git.openembedded.org/meta-openembedded
    path: layers/meta-openembedded
    #branch: scarthgap
    commit: edd1a1e284fdcb80cd48d411f235d47f23bc27ae
    layers:
      meta-oe:
      meta-python:
      meta-networking:
  
  meta-uartkbd:
    path: layers/meta-uartkbd


bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
local_conf_header:
  reduce_diskspace: |
    RM_OLD_IMAGES = "1"
    INHERIT += "rm_work"
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
  install: |
    IMAGE_INSTALL:append = " kernel-modules"
    IMAGE_FEATURES += " ssh-server-openssh"
    IMAGE_INSTALL:remove = " dropbear"
    IMAGE_INSTALL:append = " openssh-sshd"
    # IMAGE_INSTALL:append = " uartkbd"
  debug-tweaks: |
    IMAGE_FEATURES += "empty-root-password allow-empty-password allow-root-login post-install-logging"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
