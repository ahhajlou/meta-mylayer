header:
  version: 8

machine: raspberrypi5
distro: distro-eglfs
target:
  - image-eglfs

repos:
  meta-mylayer:
    path: layers/meta-mylayer

  meta-raspberry:
    url: http://git.yoctoproject.org/meta-raspberrypi
    path: layers/meta-raspberrypi
    branch: walnascar

  poky:
    url: https://git.yoctoproject.org/git/poky
    path: layers/poky
    branch: walnascar
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: http://git.openembedded.org/meta-openembedded
    path: layers/meta-openembedded
    branch: walnascar
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-qt6:
    url: https://code.qt.io/yocto/meta-qt6.git
    path: layers/meta-qt6
    tag: v6.9.0

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
local_conf_header:
  reduce_diskspace: |
    # RM_OLD_IMAGES = "1"
    # INHERIT += "rm_work"
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    DL_DIR = "/opt/download-walnascar"
  debug-tweaks: |
    IMAGE_FEATURES += "empty-root-password allow-empty-password allow-root-login post-install-logging"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
  license: |
    # Uncomment next line to allow the license
    # See: linux-firmware-rpidistro in docs/ipcompliance.md
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
